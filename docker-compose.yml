services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    # 镜像从本仓库源码就地构建，不引用任何远程预构建镜像：
    #   docker compose build && docker compose up -d
    #
    # 这里刻意不写 image:。写了的话 compose 默认 pull_policy=missing，
    # 本地没有该镜像时会先尝试 pull，拉不到就直接失败退出——不会回退去构建。
    # 指到一个没人维护/根本不存在的远程镜像名时，`up` 必挂。
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      # 回连监听（oob 服务）写库的位置，页面侧只读打开它
      OOB_DATA_DIR: /app/data/oob
    ports:
      # 宿主机端口被占用时改 .env 里的 ARTEX_PORT，别改右边（容器内固定 8787）
      - "${ARTEX_PORT:-8787}:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 把数据目录（含 jwt.key、SQLite 等）绑定到项目根目录的 data/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      - ./data:/app/data
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
      # 回连监听的 MCP 脚本。注册 MCP 时 arg 要写 /app/oob/oob_mcp.py，
      # 不挂这一份的话 agent 侧拉不起监听器，页面永远是空的。
      - ./oob:/app/oob:ro
    restart: unless-stopped

  # OOB 回连带外信道：SSRF/XXE/盲 RCE 的回连接收端。
  # 复用官方 python 镜像跑仓库里的 oob_mcp.py，不用自己构建。
  # 它的库写到 ./data/oob/oob.db，artex 容器通过 ./data 挂载读同一份文件。
  oob:
    image: python:3.12-alpine
    command: ["python3", "/app/oob_mcp.py", "--listen-only"]
    environment:
      OOB_DB: /app/data/oob.db
      OOB_LOG: /dev/stderr
      OOB_PORTS: ${OOB_PORTS:-8889,18666,18667}
      # 必填：目标要访问的公网地址。留空则功能收不到回连。
      OOB_PUBLIC_HOST: ${OOB_PUBLIC_HOST:-}
      OOB_RETENTION_DAYS: ${OOB_RETENTION_DAYS:-7}
    volumes:
      - ./oob/oob_mcp.py:/app/oob_mcp.py:ro
      - ./data/oob:/app/data
    # 端口要和 .env 里的 OOB_PORTS 对齐；改端口列表时这两处一起改。
    ports:
      - "${OOB_PORT_1:-8889}:8889"
      - "${OOB_PORT_2:-18666}:18666"
      - "${OOB_PORT_3:-18667}:18667"
    restart: unless-stopped

volumes:
  pgdata:
